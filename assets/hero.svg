<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fatih Ünal — Founder of Yequni LLC, Co-Founder of Evedi Yazılım">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#17140F"/>
      <stop offset="60%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A227" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
    .mono  { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .fade  { animation: fade 1.6s ease-out both; }
    .d1 { animation-delay: .4s; }
    .d2 { animation-delay: 1.4s; }
    .d3 { animation-delay: 3.0s; }
    .d4 { animation-delay: 3.8s; }
    .title { letter-spacing: 14px; animation: fade 2.4s ease-out 1.4s both, track 3.2s cubic-bezier(.2,.7,.2,1) 1.4s both; }
    .rule { stroke-dasharray: 360; animation: draw 1.6s ease-in-out 2.6s both; }
    .beam { animation: sweep 9s ease-in-out 1s infinite; }
    @keyframes fade  { from { opacity: 0; } }
    @keyframes track { from { letter-spacing: 34px; } }
    @keyframes draw  { from { stroke-dashoffset: 360; } }
    @keyframes sweep { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="420" fill="url(#vignette)"/>
  <rect class="beam" x="0" y="48" width="500" height="324" fill="url(#beam)"/>
  <rect width="1200" height="420" filter="url(#grain)" opacity="0.07"/>

  <!-- letterbox -->
  <rect width="1200" height="48" fill="#000"/>
  <rect y="372" width="1200" height="48" fill="#000"/>
  <text class="mono" x="32" y="30" font-size="11" fill="#5C574D" letter-spacing="3">REEL 01 · FATIH-DEVELOPER</text>
  <text class="mono" x="1168" y="30" font-size="11" fill="#5C574D" letter-spacing="3" text-anchor="end">2.39 : 1</text>
  <text class="mono" x="600" y="402" font-size="11" fill="#5C574D" letter-spacing="3" text-anchor="middle">YEQUNI LLC  ·  EVEDI YAZILIM</text>

  <!-- credits -->
  <text class="mono fade d1" x="600" y="122" font-size="13" fill="#C9A227" letter-spacing="7" text-anchor="middle">A  FATIH  ÜNAL  PRODUCTION</text>
  <text class="serif title" x="607" y="214" font-size="80" fill="#EDE6D6" text-anchor="middle">FATIH ÜNAL</text>
  <line class="rule" x1="420" y1="244" x2="780" y2="244" stroke="#C9A227" stroke-width="1"/>
  <text class="serif fade d3" x="600" y="290" font-size="22" font-style="italic" fill="#D8D0BE" text-anchor="middle">Founder · Yequni LLC   —   Co-Founder · Evedi Yazılım</text>
  <text class="mono fade d4" x="600" y="330" font-size="12" fill="#8A8478" letter-spacing="5" text-anchor="middle">AGENTIC AI  ·  AUTOMATION  ·  SYSTEMS ARCHITECTURE</text>
</svg>
