<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="Evedi Yazılım — Co-Founder. Fikirden çalışan çözüme.">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
    .mono  { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .fade  { animation: fade 1.4s ease-out both; }
    .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 1.9s; } .d4 { animation-delay: 2.5s; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="600" height="240" fill="#0A0A0A"/>
  <rect x="10.5" y="10.5" width="579" height="219" fill="none" stroke="#C9A227" stroke-opacity="0.45"/>
  <rect x="16.5" y="16.5" width="567" height="207" fill="none" stroke="#C9A227" stroke-opacity="0.15"/>

  <text class="mono fade d1" x="300" y="58" font-size="11" fill="#C9A227" letter-spacing="6" text-anchor="middle">CO-FOUNDER</text>
  <text class="serif fade d2" x="304" y="118" font-size="52" fill="#EDE6D6" letter-spacing="12" text-anchor="middle">EVEDI</text>
  <text class="mono fade d2" x="302" y="142" font-size="11" fill="#8A8478" letter-spacing="8" text-anchor="middle">Y A Z I L I M</text>
  <text class="serif fade d3" x="300" y="178" font-size="17" font-style="italic" fill="#D8D0BE" text-anchor="middle">Fikirden çalışan çözüme.</text>
  <text class="mono fade d4" x="300" y="206" font-size="10" fill="#5C574D" letter-spacing="4" text-anchor="middle">SOFTWARE  ·  EVEDI.COM.TR</text>
</svg>
